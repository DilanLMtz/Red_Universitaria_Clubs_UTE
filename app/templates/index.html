<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Red Universitaria de Clubs UTE</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        h1 { color: #2c3e50; font-size: 24px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { display: block; background: #3498db; color: white; padding: 12px; text-decoration: none; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        .btn-coord { background: #27ae60; }
        .btn-coord:hover { background: #219653; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Clubs UTE </h1>
        <p>Sistema de gestión y control de asistencia</p>
        
        <a href="/alumno" class="btn">Soy Alumno</a>
        <a href="/coordinador" class="btn btn-coord">Soy Coordinador</a>
    </div>
</body>
</html>
