<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Coordinador - UTE</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #2c3e50; }
        .btn-excel { display: inline-block; background: #e67e22; color: white; padding: 12px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 15px; }
        .btn-excel:hover { background: #d35400; }
        .back { display: inline-block; margin-top: 20px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Panel del Coordinador </h2>
        <p>Administra los clubs y gestiona las inscripciones de los alumnos de nuevo ingreso.</p>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>Gestión de Alumnos</h3>
        <p>¿Necesitas registrar a los alumnos inscritos mediante el formulario institucional?</p>
        <a href="/coordinador/subir-excel" class="btn-excel"> Subir y procesar archivo Excel</a>
        
        <br><br>
        <a href="/" class="back">← Regresar al inicio</a>
    </div>
</body>
</html>
